indefinite"/><text x="470" y="96" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a" font-family="Segoe UI,Arial,sans-serif">His food app FoodieX</text><text x="470" y="128" text-anchor="middle" font-size="25" font-weight="700" fill="#0369a1" font-family="Segoe UI,Arial,sans-serif">is live on AWS.</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8333;0.8433;1" dur="24s" repeatCount="indefinite"/><text x="470" y="96" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a" font-family="Segoe UI,Arial,sans-serif">Scroll down. I will show</text><text x="470" y="128" text-anchor="middle" font-size="25" font-weight="700" fill="#0369a1" font-family="Segoe UI,Arial,sans-serif">you everything!</text></g></svg>
